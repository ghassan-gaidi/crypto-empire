name: Whale Tracker

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Call /api/whales/refresh
        run: |
          curl -s -X GET \
            "https://crypto-empire-ten.vercel.app/api/whales/refresh" \
            -H "X-Whale-Refresh-Key: ${{ secrets.WHALE_REFRESH_SECRET }}" \
            -H "Accept: application/json" \
            --max-time 30
