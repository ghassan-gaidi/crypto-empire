name: X/Twitter Auto-Poster

on:
  schedule:
    - cron: '0 */2 * * *'   # every 2 hours
  workflow_dispatch:         # manual trigger

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install xurl
        run: npm install -g @xdevplatform/xurl

      - name: Restore xurl credentials
        run: |
          mkdir -p ~/.xurl
          echo "${{ secrets.XURL_CREDENTIALS }}" | base64 -d > ~/.xurl/config.yaml 2>/dev/null || \
          echo "${{ secrets.XURL_CREDENTIALS }}" > ~/.xurl/config.yaml
          chmod 600 ~/.xurl/config.yaml

      - name: Post tweet
        run: |
          python3 scripts/x-auto-poster.py 2>&1
